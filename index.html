<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine PRO</title>
    
    <!-- Favicon: Muestra el logo de Cine PRO en la pestaña del navegador -->
    <link rel="icon" type="image/png" href="icon.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030f0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .logo {
            max-width: 350px;
            width: 100%;
            height: auto;
            margin-bottom: 25px;
            /* Filtro para dar un leve brillo sutil */
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.15));
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #e0e0e0;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Imagen principal en la página -->
        <img src="logo.png" alt="Cine PRO Logo" class="logo">
        <h1>Muy pronto</h1>
    </div>

</body>
</html>
